# COS Graph Engine — ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cos-engine
  namespace: cos-graph-engine
  labels:
    app.kubernetes.io/name: cos-graph-engine
    app.kubernetes.io/component: engine
    app.kubernetes.io/part-of: cos
---
# Minimal RBAC — read-only access to own pods for leader election / health
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cos-engine
  namespace: cos-graph-engine
  labels:
    app.kubernetes.io/name: cos-graph-engine
    app.kubernetes.io/component: engine
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cos-engine
  namespace: cos-graph-engine
  labels:
    app.kubernetes.io/name: cos-graph-engine
    app.kubernetes.io/component: engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cos-engine
subjects:
  - kind: ServiceAccount
    name: cos-engine
    namespace: cos-graph-engine