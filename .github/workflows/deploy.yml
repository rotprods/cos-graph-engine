# COS Graph Engine — Deploy Pipeline
# Triggered after CI passes on main

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

env:
  NODE_VERSION: '18.20.4'
  WORKING_DIR: .
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: cos-graph-engine
  K8S_DEPLOYMENT: cos-engine

jobs:
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    steps:
      - run: |
          echo "❌ CI workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})"
          exit 1

  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production,enable=true
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || \
          echo "$KUBE_CONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Update deployment image
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            -n ${{ env.K8S_NAMESPACE }}
      - name: Rollout status
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s
      - name: Verify pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/component=engine
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.cos-graph-engine.dev/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (200)"
              break
            fi
            echo "Attempt $i: got $STATUS, waiting..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed after 10 attempts"
            exit 1
          fi
      - name: Test metrics endpoint
        run: |
          METRICS=$(curl -s https://api.cos-graph-engine.dev/metrics 2>/dev/null || echo "")
          if echo "$METRICS" | grep -q "cos_bfs_traversals_total"; then
            echo "✅ Metrics endpoint returns BFS data"
          else
            echo "⚠️ Metrics endpoint might not be ready"
          fi

  complete:
    name: ✅ Deploy Complete
    runs-on: ubuntu-latest
    needs: smoke-test
    if: success()
    steps:
      - run: echo "✅ COS Graph Engine deployed successfully to production"