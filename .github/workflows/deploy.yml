name: Deploy

# Convergence Era: deployment is disabled by default.
# This workflow can only be started manually and requires an explicit confirmation token.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to allow a deployment attempt'
        required: true
        default: 'NO'

jobs:
  guard:
    name: Deployment guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo 'Deployment blocked. Convergence Era keeps CD OFF by default.'
            exit 1
          fi
          echo 'Explicit deployment authorization received.'

  disabled-placeholder:
    name: Deployment intentionally disabled during convergence
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - run: |
          echo 'No production deployment steps are enabled in Convergence Era.'
          echo 'Reintroduce deployment only after an explicit authority/release decision.'
