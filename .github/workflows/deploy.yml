# COS Graph Engine — Production Deploy
# Security policy: privileged deployment is manual-only until branch/ruleset,
# environment protection, actor allowlist and cost controls are explicitly approved.

name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKING_DIR: cos
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: cos-graph-engine
  K8S_DEPLOYMENT: cos-engine

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image ref
        id: image
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          echo "ref=${REGISTRY}/${IMAGE_NAME}:${checked_out_sha}" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy exact image to K8s
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Update deployment image
        run: |
          kubectl set image deployment/${K8S_DEPLOYMENT} \
            engine=${{ needs.build.outputs.image }} \
            -n ${K8S_NAMESPACE}
      - name: Rollout status
        run: kubectl rollout status deployment/${K8S_DEPLOYMENT} -n ${K8S_NAMESPACE} --timeout=180s

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            status=$(curl --fail-with-body --silent --output /dev/null --write-out '%{http_code}' https://api.cos-graph-engine.dev/health || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo 'health check failed' >&2
          exit 1
