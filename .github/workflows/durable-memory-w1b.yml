name: Durable Memory W1B

on:
  push:
    branches: [fix/durable-memory-w1b]
  pull_request:
    branches: [test/coverage-orphan-suites-w1]
    paths:
      - 'packages/infrastructure/src/persistence.ts'
      - 'packages/api/src/server-persist.ts'
      - 'packages/api/src/server.ts'
      - 'packages/memory/src/memory-manager.ts'
      - 'scripts/test-durable-memory-w1b.cjs'
      - 'scripts/test-durable-memory-w1b-adversarial.cjs'
      - 'scripts/check-w1b-coverage-ratchet.mjs'
      - 'package.json'
      - '.github/workflows/durable-memory-w1b.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: durable-memory-w1b-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  W1B_PARENT_SHA: 'd0d63a665a7b89205c76145a4b669a2f12866500'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${W1B_PARENT_SHA}^{commit}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: W1B durability contract
        run: |
          set -euo pipefail
          node --import tsx scripts/test-durable-memory-w1b.cjs 2>&1 | tee w1b-durability.log
      - name: W1B adversarial gauntlet
        run: |
          set -euo pipefail
          node --import tsx scripts/test-durable-memory-w1b-adversarial.cjs 2>&1 | tee w1b-adversarial.log
      - name: Memory regression corpus
        run: |
          set -euo pipefail
          node scripts/test-memory-regressions.cjs 2>&1 | tee w1b-memory-regressions.log
      - name: Full canonical test suite
        run: |
          set -euo pipefail
          npm run test:all 2>&1 | tee w1b-test-all.log
      - name: Unified coverage corpus
        run: |
          set -euo pipefail
          npm run coverage 2>&1 | tee w1b-coverage.log
      - name: Ratchet against exact W1A parent coverage
        run: node scripts/check-w1b-coverage-ratchet.mjs
      - name: High-severity dependency audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high 2>&1 | tee w1b-npm-audit.log
      - name: Scope and anti-bypass policy
        run: |
          set -euo pipefail
          git diff --unified=0 "$W1B_PARENT_SHA"...HEAD -- '*.ts' > w1b-source.diff
          if grep -E '^\+.*(as any|@ts-ignore|@ts-nocheck|continue-on-error)' w1b-source.diff; then
            echo 'W1B introduced a forbidden TypeScript bypass' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              packages/infrastructure/src/persistence.ts|packages/api/src/server-persist.ts|packages/api/src/server.ts|packages/memory/src/memory-manager.ts|scripts/test-durable-memory-w1b.cjs|scripts/test-durable-memory-w1b-adversarial.cjs|scripts/check-w1b-coverage-ratchet.mjs|.github/workflows/durable-memory-w1b.yml|package.json|docs/hardening/durable-memory/W1B_CLAIM.md|docs/hardening/durable-memory/W1B_RED_EVIDENCE.md)
                ;;
              *)
                echo "Unexpected W1B scope mutation: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$W1B_PARENT_SHA"...HEAD)
      - name: Preserve W1B qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-memory-w1b-${{ github.sha }}
          path: |
            w1b-durability.log
            w1b-adversarial.log
            w1b-memory-regressions.log
            w1b-test-all.log
            w1b-coverage.log
            w1b-coverage-ratchet.json
            w1b-npm-audit.log
            w1b-source.diff
            coverage/
          if-no-files-found: warn
