name: Graph Framework Protocol

on:
  pull_request:
    paths:
      - 'packages/graph/src/framework/**'
      - 'packages/graph/src/csr.ts'
      - 'packages/core/src/**'
      - 'scripts/test-framework-protocol.ts'
      - 'scripts/test-framework-protocol-hardening.ts'
      - 'scripts/test-framework-state-store.ts'
      - 'scripts/test-framework-state-runtime.ts'
      - 'scripts/test-framework-csr-adapter.ts'
      - 'tsconfig.framework.json'
      - '.github/workflows/framework-protocol.yml'
  push:
    branches:
      - 'feat/graph-framework-protocol-v1'
      - 'feat/graph-state-kernel-v1'
      - 'feat/graph-state-runtime-v1'
      - 'feat/graph-csr-adapter-v1'
    paths:
      - 'packages/graph/src/framework/**'
      - 'packages/graph/src/csr.ts'
      - 'packages/core/src/**'
      - 'scripts/test-framework-protocol.ts'
      - 'scripts/test-framework-protocol-hardening.ts'
      - 'scripts/test-framework-state-store.ts'
      - 'scripts/test-framework-state-runtime.ts'
      - 'scripts/test-framework-csr-adapter.ts'
      - 'tsconfig.framework.json'
      - '.github/workflows/framework-protocol.yml'

permissions:
  contents: read

concurrency:
  group: graph-framework-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted strict typecheck
        run: npx --no-install tsc -p tsconfig.framework.json --noEmit
      - name: Framework regression suites
        run: |
          npx --no-install tsx scripts/test-framework-protocol.ts
          npx --no-install tsx scripts/test-framework-protocol-hardening.ts
          npx --no-install tsx scripts/test-framework-state-store.ts
          npx --no-install tsx scripts/test-framework-state-runtime.ts
          npx --no-install tsx scripts/test-framework-csr-adapter.ts
