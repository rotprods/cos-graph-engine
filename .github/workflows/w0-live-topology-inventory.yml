name: W0 live topology inventory

on:
  push:
    branches: [forensics/w0-live-topology-20260915]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  QUALIFIED_SHA: e3e198ce01e576d30ac89b3760a52f2d8461d781

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Snapshot branch / PR / issue topology
        env:
          API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse
          from collections import Counter, defaultdict

          repo = os.environ['REPOSITORY']
          token = os.environ['API_TOKEN']
          qualified = os.environ['QUALIFIED_SHA']

          def git(*args, check=True):
              p = subprocess.run(['git', *args], text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)} failed: {p.stderr.strip()}")
              return p.stdout.strip(), p.returncode

          def api_pages(path):
              out = []
              page = 1
              while True:
                  sep = '&' if '?' in path else '?'
                  url = f'https://api.github.com/repos/{repo}{path}{sep}per_page=100&page={page}'
                  req = urllib.request.Request(url, headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cgev11-w0-topology',
                  })
                  with urllib.request.urlopen(req, timeout=30) as response:
                      batch = json.loads(response.read().decode())
                  if not isinstance(batch, list):
                      raise RuntimeError(f'Expected list from {url}')
                  out.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return out

          main_sha, _ = git('rev-parse', 'refs/remotes/origin/main')
          if qualified != subprocess.check_output(['git','rev-parse', qualified], text=True).strip():
              raise RuntimeError('Qualified SHA cannot be resolved exactly')

          pulls_raw = api_pages('/pulls?state=all&sort=updated&direction=desc')
          prs = []
          by_head = defaultdict(list)
          for p in pulls_raw:
              item = {
                  'number': p['number'],
                  'state': p['state'],
                  'draft': bool(p.get('draft')),
                  'merged': p.get('merged_at') is not None,
                  'mergedAt': p.get('merged_at'),
                  'title': p['title'],
                  'headRef': p['head']['ref'],
                  'headSha': p['head']['sha'],
                  'baseRef': p['base']['ref'],
                  'baseSha': p['base']['sha'],
                  'updatedAt': p.get('updated_at'),
                  'url': p['html_url'],
              }
              prs.append(item)
              by_head[item['headRef']].append(item)

          raw_issues = api_pages('/issues?state=all&sort=updated&direction=desc')
          issues = [
              {
                  'number': i['number'], 'state': i['state'], 'title': i['title'],
                  'updatedAt': i.get('updated_at'), 'url': i['html_url']
              }
              for i in raw_issues if 'pull_request' not in i
          ]

          refs_text, _ = git('for-each-ref', '--format=%(refname:short)\t%(objectname)', 'refs/remotes/origin')
          branches = []
          for line in refs_text.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\t', 1)
              if ref == 'origin/HEAD':
                  continue
              name = ref.removeprefix('origin/')
              counts, _ = git('rev-list', '--left-right', '--count', f'origin/main...{ref}')
              left, right = [int(x) for x in counts.split()]
              _, ancestor_rc = git('merge-base', '--is-ancestor', ref, 'origin/main', check=False)
              head_prs = by_head.get(name, [])
              open_prs = [p for p in head_prs if p['state'] == 'open']
              merged_prs = [p for p in head_prs if p['merged']]
              closed_unmerged = [p for p in head_prs if p['state'] == 'closed' and not p['merged']]

              if open_prs:
                  classification = 'ACTIVE_PR'
              elif merged_prs and right > 0:
                  classification = 'MERGED_PR_BRANCH_WITH_POSTMERGE_DELTA'
              elif merged_prs:
                  classification = 'MERGED_PR_BRANCH_RETAINED'
              elif closed_unmerged:
                  classification = 'CLOSED_UNMERGED_PR_BRANCH'
              elif right > 0:
                  classification = 'NO_PR_UNMERGED_COMMITS'
              else:
                  classification = 'NO_PR_NO_UNIQUE_COMMITS'

              branches.append({
                  'name': name,
                  'sha': sha,
                  'aheadOfMain': right,
                  'behindMain': left,
                  'reachableFromMain': ancestor_rc == 0,
                  'classification': classification,
                  'prs': [p['number'] for p in head_prs],
                  'openPrs': [p['number'] for p in open_prs],
                  'mergedPrs': [p['number'] for p in merged_prs],
                  'closedUnmergedPrs': [p['number'] for p in closed_unmerged],
              })

          branches.sort(key=lambda b: (b['classification'], -b['aheadOfMain'], b['name']))
          class_counts = Counter(b['classification'] for b in branches)
          candidate_no_pr = [b for b in branches if b['classification'] == 'NO_PR_UNMERGED_COMMITS']
          closed_donors = [b for b in branches if b['classification'] == 'CLOSED_UNMERGED_PR_BRANCH' and b['aheadOfMain'] > 0]
          postmerge_delta = [b for b in branches if b['classification'] == 'MERGED_PR_BRANCH_WITH_POSTMERGE_DELTA']

          report = {
              'schema': 'cgev11.w0-live-topology/v1',
              'repository': repo,
              'capturedAt': subprocess.check_output(['date','-u','+%Y-%m-%dT%H:%M:%SZ'], text=True).strip(),
              'mainSha': main_sha,
              'qualifiedW3SourceSha': qualified,
              'counts': {
                  'remoteBranches': len(branches),
                  'pullRequestsAll': len(prs),
                  'pullRequestsOpen': sum(1 for p in prs if p['state'] == 'open'),
                  'pullRequestsMerged': sum(1 for p in prs if p['merged']),
                  'pullRequestsClosedUnmerged': sum(1 for p in prs if p['state'] == 'closed' and not p['merged']),
                  'issuesAll': len(issues),
                  'issuesOpen': sum(1 for i in issues if i['state'] == 'open'),
                  'branchClassifications': dict(sorted(class_counts.items())),
                  'noPrUnmergedBranches': len(candidate_no_pr),
                  'closedUnmergedDonorBranches': len(closed_donors),
                  'mergedBranchesWithPostMergeDelta': len(postmerge_delta),
              },
              'highSignal': {
                  'noPrUnmergedBranches': candidate_no_pr,
                  'closedUnmergedDonorBranches': closed_donors,
                  'mergedBranchesWithPostMergeDelta': postmerge_delta,
              },
              'branches': branches,
              'pullRequests': prs,
              'issues': issues,
          }

          with open('w0-live-topology.json', 'w') as f:
              json.dump(report, f, indent=2)
              f.write('\n')

          summary = {
              'mainSha': main_sha,
              'counts': report['counts'],
              'noPrUnmergedTop20': [
                  {'name': b['name'], 'sha': b['sha'], 'ahead': b['aheadOfMain'], 'behind': b['behindMain']}
                  for b in sorted(candidate_no_pr, key=lambda b: -b['aheadOfMain'])[:20]
              ],
              'closedUnmergedDonorTop20': [
                  {'name': b['name'], 'sha': b['sha'], 'ahead': b['aheadOfMain'], 'prs': b['closedUnmergedPrs']}
                  for b in sorted(closed_donors, key=lambda b: -b['aheadOfMain'])[:20]
              ],
              'postMergeDeltaTop20': [
                  {'name': b['name'], 'sha': b['sha'], 'ahead': b['aheadOfMain'], 'prs': b['mergedPrs']}
                  for b in sorted(postmerge_delta, key=lambda b: -b['aheadOfMain'])[:20]
              ],
          }
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w0-live-topology-${{ github.sha }}
          path: w0-live-topology.json
          if-no-files-found: error
