name: HTTP Egress Security W1D3

on:
  push:
    branches: [fix/http-egress-w1d3]
  pull_request:
    branches: [fix/tool-capability-isolation-w1d]
    paths:
      - 'packages/execution/src/tool-runtime.ts'
      - 'scripts/test-http-egress-w1d3.cjs'
      - '.github/workflows/http-egress-security-w1d3.yml'
      - 'docs/hardening/http-egress/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: http-egress-security-w1d3-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  W1D3_PARENT_SHA: 'aadd8a1079f5acd2d3f0f9b00af3bd6c8bc83e0b'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${W1D3_PARENT_SHA}^{commit}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record runtime floor
        run: |
          set -euo pipefail
          node --version | tee w1d3-node-version.log
          test "$(node --version)" = 'v22.12.0'
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: Preserve qualified registry boundary
        run: |
          set -euo pipefail
          node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee w1d3-registry-regression.log
      - name: W1D3 HTTP egress security contract
        run: |
          set -euo pipefail
          node --import tsx scripts/test-http-egress-w1d3.cjs 2>&1 | tee w1d3-http-contract.log
      - name: Full canonical test suite
        run: |
          set -euo pipefail
          npm run test:all 2>&1 | tee w1d3-test-all.log
      - name: High-severity dependency audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high 2>&1 | tee w1d3-npm-audit.log
      - name: Scope and anti-bypass policy
        run: |
          set -euo pipefail
          git diff --unified=0 "$W1D3_PARENT_SHA"...HEAD -- '*.ts' '*.cjs' > w1d3-source.diff
          if grep -E '^\+.*(as any|@ts-ignore|@ts-nocheck|continue-on-error|new Function\(|eval\(|console\.log[[:space:]]*=)' w1d3-source.diff; then
            echo 'W1D3 introduced a forbidden bypass or dynamic-code primitive' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              packages/execution/src/tool-runtime.ts|scripts/test-http-egress-w1d3.cjs|.github/workflows/http-egress-security-w1d3.yml|docs/hardening/http-egress/W1D3_RED_EVIDENCE.md|docs/hardening/http-egress/W1D3_GREEN_EVIDENCE.md)
                ;;
              *)
                echo "Unexpected W1D3 scope mutation: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$W1D3_PARENT_SHA"...HEAD)
      - name: Preserve W1D3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-egress-security-w1d3-${{ github.sha }}
          path: |
            w1d3-node-version.log
            w1d3-registry-regression.log
            w1d3-http-contract.log
            w1d3-test-all.log
            w1d3-npm-audit.log
            w1d3-source.diff
          if-no-files-found: warn
