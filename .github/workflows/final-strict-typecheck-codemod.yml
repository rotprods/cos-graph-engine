name: Final strict typecheck codemod

on:
  push:
    branches: [fix/strict-typecheck-regressions]
    paths:
      - '.github/workflows/final-strict-typecheck-codemod.yml'
      - 'scripts/final-strict-codemod.py'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-typecheck-regressions
          fetch-depth: 0
      - name: Apply codemod
        run: python scripts/final-strict-codemod.py
      - name: Commit and self-delete
        run: |
          rm scripts/final-strict-codemod.py
          rm .github/workflows/final-strict-typecheck-codemod.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/graph/src/playground.ts packages/graph/src/csr.ts packages/graph/src/visualizer.ts scripts/final-strict-codemod.py .github/workflows/final-strict-typecheck-codemod.yml
          git commit -m 'fix(graph): reconcile final legacy visualization surfaces'
          git push origin HEAD:fix/strict-typecheck-regressions
