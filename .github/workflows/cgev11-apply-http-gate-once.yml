name: CGEV11 apply reviewed HTTP gate once
on:
  push:
    branches: [fix/cgev11-auth-boundary-20260907]
    paths: ['.github/workflows/cgev11-apply-http-gate-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'rotprods/cos-graph-engine' && github.ref == 'refs/heads/fix/cgev11-auth-boundary-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply two reviewed replacements to the exact source blob
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const path = 'packages/api/src/http-server.ts';
          const bytes = fs.readFileSync(path);
          const hash = createHash('sha1').update(Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])).digest('hex');
          if (hash !== '75ff084d5cd2965624d77a52a23545a0271163ee') throw new Error('HTTP source changed; refusing stale rewrite');
          let text = bytes.toString('utf8');
          const edits = [
            [
              '      const identity = await this.auth.authenticate(authHeader);',
              '      const identity = await this.auth.authenticate(authHeader);\n\n      // Authorize before body parsing or any service side effects.\n      if (!this.auth.authorize(identity, method, path)) {\n        await this.sendJson(res, identity.tokenType === \'none\' ? 401 : 403, { error: \'Unauthorized or insufficient permissions\' });\n        return;\n      }'
            ],
            [
              '        await this.sendJson(res, 200, this.config.snapshot());',
              '        res.setHeader(\'Cache-Control\', \'no-store\');\n        await this.sendJson(res, 200, this.auth.redactedConfiguration());'
            ]
          ];
          for (const [oldText, newText] of edits) {
            if (text.split(oldText).length !== 2) throw new Error('Non-unique HTTP edit anchor');
            text = text.replace(oldText, newText);
          }
          fs.writeFileSync(path, text);
          console.log('Applied reviewed HTTP gate and credential-redaction replacements');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run asbuild
      - run: npx --no-install tsc --noEmit
      - run: node --import tsx scripts/test-auth-boundary.cjs
      - run: node scripts/test-memory-regressions.cjs
      - run: timeout 240s npm run test:all
      - name: Commit only the verified HTTP patch and remove this one-shot writer
        run: |
          git diff --check
          rm .github/workflows/cgev11-apply-http-gate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/http-server.ts .github/workflows/cgev11-apply-http-gate-once.yml
          git commit -m 'fix(api): enforce authorization before body parsing and redact config credentials'
          git push origin HEAD:fix/cgev11-auth-boundary-20260907
