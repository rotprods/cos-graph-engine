name: CGEV11 Recovery Stack Integration

on:
  push:
    branches: [integration/cgev11-w1b-w1d-20260911]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cgev11-recovery-stack-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 'bc9250ccd39663cffc6860c5bbe9f1a24b0281ac'
  W1B_SHA: '08c90d11d850f7c4f0c95702a4d0a541a1cf5e02'
  W1C_SHA: 'f85fe66bce8079c0e3ec481bbeb3a88bf2c8184c'
  W1D_SHA: '5a0b4b2a0b97794ac8cf7feb7ca9ed26bde15c25'
  W2_SHA: '3ff1609cf7270e393f9fa0f7e89da97fbf0a6651'
  W1C_SANDBOX_IMAGE: 'node@sha256:ef24c5053d50fdc3e4e56eb4e7ddb7861874ab0fdc797046ba897581deb8e868'

jobs:
  node22-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate and recovery ancestry
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          for sha in "$BASELINE_SHA" "$W1B_SHA" "$W1C_SHA" "$W1D_SHA" "$W2_SHA"; do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$actual" | tee cgev11-node22-tested-sha.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind minimum runtime
        run: |
          set -euo pipefail
          node --version | tee cgev11-node22-version.log
          test "$(node --version)" = 'v22.12.0'
      - name: Verify pinned sandbox TCB
        run: |
          set -euo pipefail
          docker version 2>&1 | tee cgev11-node22-docker.log
          docker pull "$W1C_SANDBOX_IMAGE" 2>&1 | tee cgev11-node22-image-pull.log
          docker image inspect "$W1C_SANDBOX_IMAGE" --format '{{json .RepoDigests}}' | tee cgev11-node22-image-inspect.log
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: W1B durable authority
        run: |
          set -euo pipefail
          node scripts/test-memory-regressions.cjs 2>&1 | tee cgev11-node22-memory-regressions.log
          node --import tsx scripts/test-durable-memory-w1b.cjs 2>&1 | tee cgev11-node22-w1b.log
          node --import tsx scripts/test-durable-memory-w1b-adversarial.cjs 2>&1 | tee cgev11-node22-w1b-adversarial.log
          node --import tsx scripts/test-durable-memory-w1b-schema-matrix.cjs 2>&1 | tee cgev11-node22-w1b-schema.log
      - name: W1C semantics through portable current-runtime harness
        run: |
          set -euo pipefail
          node scripts/test-sandbox-security-w1d5.cjs 2>&1 | tee cgev11-node22-w1c-portable-core.log
          node --import tsx scripts/test-sandbox-security-integration.cjs 2>&1 | tee cgev11-node22-w1c-carry-forward.log
      - name: W1D host capability boundary
        run: |
          set -euo pipefail
          node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee cgev11-node22-w1d-registry.log
          node --import tsx scripts/test-filesystem-confinement-w1d2.cjs 2>&1 | tee cgev11-node22-w1d-filesystem.log
          node --import tsx scripts/test-http-egress-w1d3.cjs 2>&1 | tee cgev11-node22-w1d-http.log
          node --import tsx scripts/test-search-tool-w1d4.cjs 2>&1 | tee cgev11-node22-w1d-search.log
          node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs 2>&1 | tee cgev11-node22-w1d-e2e.log
      - name: W2 operator and HTTP security compatibility
        run: |
          set -euo pipefail
          node --import tsx scripts/test-operator-auth-rollout.cjs 2>&1 | tee cgev11-node22-w2-operator.log
          node --import tsx scripts/test-http-trust-boundary-w2.cjs 2>&1 | tee cgev11-node22-w2-http.log
          node scripts/check-w2-production-security.mjs 2>&1 | tee cgev11-node22-w2-production-security.log
      - name: Full canonical suite
        run: |
          set -euo pipefail
          npm run test:all 2>&1 | tee cgev11-node22-test-all.log
      - name: Integrated coverage against final W1D floor
        run: |
          set -euo pipefail
          npm run asbuild
          npx --no-install c8 --reporter=text --reporter=lcov --reporter=json-summary sh -c 'npm run test:coverage:all && node --import tsx scripts/test-sandbox-coverage-integration.cjs && node --import tsx scripts/test-sandbox-security-integration.cjs && node --import tsx scripts/test-tool-capability-w1d.cjs && node --import tsx scripts/test-filesystem-confinement-w1d2.cjs && node --import tsx scripts/test-http-egress-w1d3.cjs && node --import tsx scripts/test-search-tool-w1d4.cjs && node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs && node --import tsx scripts/test-operator-auth-rollout.cjs && node --import tsx scripts/test-http-trust-boundary-w2.cjs' 2>&1 | tee cgev11-node22-coverage.log
          node scripts/check-cgev11-stack-coverage.mjs
      - name: High-severity dependency audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high 2>&1 | tee cgev11-node22-audit.log
      - name: Qualified recovery plus W2 scope and anti-bypass
        run: |
          set -euo pipefail
          git diff --unified=0 "$W1D_SHA"...HEAD -- '*.ts' '*.cjs' '*.mjs' > cgev11-stack-source.diff
          if grep -E '^\+.*(as any|@ts-ignore|@ts-nocheck|new Function\(|eval\(|console\.log[[:space:]]*=)' cgev11-stack-source.diff; then
            echo 'Integration candidate introduced a forbidden code/type bypass or dynamic-code primitive' >&2
            exit 1
          fi
          node scripts/test-workflow-safety.mjs 2>&1 | tee cgev11-node22-workflow-safety.log
          node scripts/check-w2-production-security.mjs 2>&1 | tee cgev11-node22-w2-production-security-scope.log
          bad_key='continue-on''-error:'
          while IFS= read -r workflow; do
            [ -z "$workflow" ] && continue
            if grep -nE "^[[:space:]]*${bad_key}" "$workflow"; then
              echo "Integration workflow introduced fail-open execution: $workflow" >&2
              exit 1
            fi
          done < <(git diff --name-only "$W1D_SHA"...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/cgev11-stack-integration.yml|scripts/check-cgev11-stack-coverage.mjs|scripts/test-sandbox-security-integration.cjs|scripts/test-sandbox-coverage-integration.cjs|docs/hardening/integration/W3_1_INTEGRATION_EVIDENCE.md|.github/workflows/w2-security-closure.yml|docs/security/W2_HTTP_OPERATOR_AUTHORITY.md|packages/api/src/chat.html|packages/api/src/dashboard.html|packages/api/src/http-server.ts|packages/api/src/operator-ui.ts|packages/api/src/research.html|packages/deployment/src/api-client.ts|packages/deployment/src/cli.ts|packages/deployment/src/operator-auth.ts|scripts/check-w2-production-security.mjs|scripts/test-http-trust-boundary-w2.cjs|scripts/test-operator-auth-rollout.cjs|docs/hardening/integration/W3_2_PROMOTION_EVIDENCE.md)
                ;;
              *)
                echo "Unexpected mutation above qualified W1D/W2 tree: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$W1D_SHA"...HEAD)
      - name: Preserve Node 22 stack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cgev11-stack-node22-${{ github.sha }}
          path: |
            cgev11-node22-*.log
            cgev11-stack-source.diff
            cgev11-stack-coverage.json
            coverage/
          if-no-files-found: warn
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  node26-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate and recovery ancestry
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          for sha in "$BASELINE_SHA" "$W1B_SHA" "$W1C_SHA" "$W1D_SHA" "$W2_SHA"; do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$actual" | tee cgev11-node26-tested-sha.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind comparison runtime
        run: |
          set -euo pipefail
          node --version | tee cgev11-node26-version.log
          test "$(node --version)" = 'v26.8.2'
      - name: Verify pinned sandbox TCB
        run: |
          set -euo pipefail
          docker pull "$W1C_SANDBOX_IMAGE" 2>&1 | tee cgev11-node26-image-pull.log
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: W1B durable authority compatibility
        run: |
          set -euo pipefail
          node scripts/test-memory-regressions.cjs 2>&1 | tee cgev11-node26-memory-regressions.log
          node --import tsx scripts/test-durable-memory-w1b.cjs 2>&1 | tee cgev11-node26-w1b.log
          node --import tsx scripts/test-durable-memory-w1b-adversarial.cjs 2>&1 | tee cgev11-node26-w1b-adversarial.log
          node --import tsx scripts/test-durable-memory-w1b-schema-matrix.cjs 2>&1 | tee cgev11-node26-w1b-schema.log
      - name: W1C semantics through portable current-runtime harness
        run: |
          set -euo pipefail
          node scripts/test-sandbox-security-w1d5.cjs 2>&1 | tee cgev11-node26-w1c-portable-core.log
          node --import tsx scripts/test-sandbox-security-integration.cjs 2>&1 | tee cgev11-node26-w1c-carry-forward.log
      - name: W1D host capability compatibility
        run: |
          set -euo pipefail
          node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee cgev11-node26-w1d-registry.log
          node --import tsx scripts/test-filesystem-confinement-w1d2.cjs 2>&1 | tee cgev11-node26-w1d-filesystem.log
          node --import tsx scripts/test-http-egress-w1d3.cjs 2>&1 | tee cgev11-node26-w1d-http.log
          node --import tsx scripts/test-search-tool-w1d4.cjs 2>&1 | tee cgev11-node26-w1d-search.log
          node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs 2>&1 | tee cgev11-node26-w1d-e2e.log
      - name: W2 operator and HTTP security compatibility
        run: |
          set -euo pipefail
          node --import tsx scripts/test-operator-auth-rollout.cjs 2>&1 | tee cgev11-node26-w2-operator.log
          node --import tsx scripts/test-http-trust-boundary-w2.cjs 2>&1 | tee cgev11-node26-w2-http.log
          node scripts/check-w2-production-security.mjs 2>&1 | tee cgev11-node26-w2-production-security.log
      - name: Full canonical suite
        run: |
          set -euo pipefail
          npm run test:all 2>&1 | tee cgev11-node26-test-all.log
      - name: Preserve Node 26 stack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cgev11-stack-node26-${{ github.sha }}
          path: cgev11-node26-*.log
          if-no-files-found: warn
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  stack-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [node22-stack, node26-stack]
    steps:
      - name: Verify exact-SHA stack receipts
        env:
          STACK_RESULTS: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE' | tee cgev11-stack-receipt.json
          const results = JSON.parse(process.env.STACK_RESULTS);
          const expected = ['node22-stack', 'node26-stack'];
          for (const id of expected) {
            const job = results[id];
            if (!job || job.result !== 'success') throw new Error(`${id} did not succeed`);
            if (job.outputs?.tested_sha !== process.env.EXPECTED_SHA) throw new Error(`${id} tested stale SHA`);
            if (job.outputs?.completed !== 'true') throw new Error(`${id} lacks completion receipt`);
          }
          process.stdout.write(`${JSON.stringify({
            schema: 'cgev11.stack-integration/receipt/v2',
            candidateSha: process.env.EXPECTED_SHA,
            w2AuthoritySha: process.env.W2_SHA || null,
            checkedJobs: expected,
            result: 'PASS',
            productionCertified: false,
            mainMergeAuthorized: false,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cgev11-stack-receipt-${{ github.sha }}
          path: cgev11-stack-receipt.json
          if-no-files-found: error
