name: Tool Capability Isolation W1D

on:
  push:
    branches: [fix/tool-capability-isolation-w1d]
  pull_request:
    branches: [fix/sandbox-security-w1c]
    paths:
      - 'packages/execution/src/tool-runtime.ts'
      - 'scripts/test-tool-capability-w1d.cjs'
      - '.github/workflows/tool-capability-isolation-w1d.yml'
      - 'docs/hardening/tool-capability-isolation/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tool-capability-isolation-w1d-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  W1D_PARENT_SHA: 'f85fe66bce8079c0e3ec481bbeb3a88bf2c8184c'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${W1D_PARENT_SHA}^{commit}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record runtime floor
        run: |
          set -euo pipefail
          node --version | tee w1d-node-version.log
          test "$(node --version)" = 'v22.12.0'
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: W1D ToolRegistry capability contract
        run: |
          set -euo pipefail
          node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee w1d-capability-contract.log
      - name: Full canonical test suite
        run: |
          set -euo pipefail
          npm run test:all 2>&1 | tee w1d-test-all.log
      - name: High-severity dependency audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high 2>&1 | tee w1d-npm-audit.log
      - name: Scope and anti-bypass policy
        run: |
          set -euo pipefail
          git diff --unified=0 "$W1D_PARENT_SHA"...HEAD -- '*.ts' '*.cjs' > w1d-source.diff
          if grep -E '^\+.*(as any|@ts-ignore|@ts-nocheck|continue-on-error|new Function\(|eval\(|console\.log[[:space:]]*=)' w1d-source.diff; then
            echo 'W1D introduced a forbidden bypass or dynamic-code primitive' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              packages/execution/src/tool-runtime.ts|scripts/test-tool-capability-w1d.cjs|.github/workflows/tool-capability-isolation-w1d.yml|docs/hardening/tool-capability-isolation/W1D_DONOR_LEDGER.md|docs/hardening/tool-capability-isolation/W1D_RED_EVIDENCE.md|docs/hardening/tool-capability-isolation/W1D_GREEN_EVIDENCE.md|docs/hardening/tool-capability-isolation/W1D_CLAIM.md)
                ;;
              *)
                echo "Unexpected W1D scope mutation: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$W1D_PARENT_SHA"...HEAD)
      - name: Preserve W1D qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-capability-isolation-w1d-${{ github.sha }}
          path: |
            w1d-node-version.log
            w1d-capability-contract.log
            w1d-test-all.log
            w1d-npm-audit.log
            w1d-source.diff
          if-no-files-found: warn
