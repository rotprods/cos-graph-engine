name: W0 orphan branch cluster analysis

on:
  push:
    branches: [forensics/w0-live-topology-20260915]

permissions:
  contents: read
  pull-requests: read

env:
  QUALIFIED_SHA: e3e198ce01e576d30ac89b3760a52f2d8461d781

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Cluster historical no-PR refs
        env:
          API_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from collections import defaultdict

          repo = os.environ['REPOSITORY']
          token = os.environ['API_TOKEN']
          qualified = os.environ['QUALIFIED_SHA']

          def git(*args, check=True):
              p = subprocess.run(['git', *args], text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)} failed: {p.stderr.strip()}")
              return p.stdout.strip(), p.returncode

          def api_pages(path):
              out, page = [], 1
              while True:
                  sep = '&' if '?' in path else '?'
                  url = f'https://api.github.com/repos/{repo}{path}{sep}per_page=100&page={page}'
                  req = urllib.request.Request(url, headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cgev11-w0-cluster',
                  })
                  with urllib.request.urlopen(req, timeout=30) as r:
                      batch = json.loads(r.read().decode())
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def patch_ids(range_expr):
              log = subprocess.Popen(
                  ['git', 'log', '--no-merges', '--pretty=format:%H', '--reverse', range_expr],
                  text=True, stdout=subprocess.PIPE
              )
              commits = [c.strip() for c in log.stdout if c.strip()]
              log.wait()
              result = {}
              for sha in commits:
                  show = subprocess.Popen(['git','show','--pretty=format:','--binary',sha], stdout=subprocess.PIPE)
                  pid = subprocess.run(['git','patch-id','--stable'], stdin=show.stdout, text=True, capture_output=True)
                  show.stdout.close()
                  show.wait()
                  if pid.returncode == 0 and pid.stdout.strip():
                      patch = pid.stdout.split()[0]
                      result[patch] = sha
              return result

          pulls = api_pages('/pulls?state=all&sort=updated&direction=desc')
          heads_with_pr = {p['head']['ref'] for p in pulls}

          refs_text, _ = git('for-each-ref', '--format=%(refname:short)\t%(objectname)', 'refs/remotes/origin')
          candidates = []
          for line in refs_text.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\t', 1)
              if ref == 'origin/HEAD':
                  continue
              name = ref.removeprefix('origin/')
              if name in heads_with_pr or name.startswith('forensics/') or name == 'main':
                  continue
              counts, _ = git('rev-list','--left-right','--count',f'origin/main...{ref}')
              behind, ahead = map(int, counts.split())
              if ahead <= 0:
                  continue
              candidates.append({'name': name, 'ref': ref, 'sha': sha, 'aheadOfMain': ahead, 'behindMain': behind})

          candidates.sort(key=lambda x: x['name'])
          names = [c['name'] for c in candidates]
          by_name = {c['name']: c for c in candidates}

          # Pairwise ancestry edges A -> B where A is ancestor of B.
          ancestry = []
          for a in candidates:
              for b in candidates:
                  if a['name'] == b['name']:
                      continue
                  _, rc = git('merge-base','--is-ancestor',a['ref'],b['ref'],check=False)
                  if rc == 0:
                      ancestry.append({'ancestor': a['name'], 'descendant': b['name']})

          ancestors_of = defaultdict(set)
          descendants_of = defaultdict(set)
          for e in ancestry:
              descendants_of[e['ancestor']].add(e['descendant'])
              ancestors_of[e['descendant']].add(e['ancestor'])

          tips = sorted(n for n in names if not descendants_of[n])

          w3_patch = patch_ids(f'origin/main..{qualified}')
          w3_patch_set = set(w3_patch)

          for c in candidates:
              ref = c['ref']
              counts_w3, _ = git('rev-list','--left-right','--count',f'{qualified}...{ref}')
              w3_unique, branch_unique = map(int, counts_w3.split())
              c['uniqueCommitsVsW3'] = branch_unique
              c['w3CommitsNotInBranch'] = w3_unique
              _, rc1 = git('merge-base','--is-ancestor',ref,qualified,check=False)
              _, rc2 = git('merge-base','--is-ancestor',qualified,ref,check=False)
              c['ancestorOfW3'] = rc1 == 0
              c['descendantOfW3'] = rc2 == 0
              c['ancestorsWithinCandidates'] = sorted(ancestors_of[c['name']])
              c['descendantsWithinCandidates'] = sorted(descendants_of[c['name']])
              c['isFamilyTip'] = c['name'] in tips

              paths_main, _ = git('diff','--name-only',f'origin/main...{ref}')
              paths_w3, _ = git('diff','--name-only',f'{qualified}...{ref}')
              c['changedPathsVsMain'] = [p for p in paths_main.splitlines() if p]
              c['changedPathsVsW3'] = [p for p in paths_w3.splitlines() if p]

              bp = patch_ids(f'origin/main..{ref}')
              bset = set(bp)
              overlap = bset & w3_patch_set
              c['patchIdCountVsMain'] = len(bset)
              c['patchIdOverlapWithW3'] = len(overlap)
              c['patchIdUniqueToBranch'] = len(bset - w3_patch_set)
              c['patchOverlapRatio'] = round(len(overlap) / len(bset), 4) if bset else 1.0

              # Safe preliminary disposition: structure-based, never calls work lost solely by name.
              if c['ancestorOfW3']:
                  disposition = 'ALREADY_ANCESTRY_CONTAINED_IN_W3'
              elif c['descendantsWithinCandidates']:
                  disposition = 'CHAIN_ANCESTOR_SUPERSEDED_BY_LATER_NO_PR_REF'
              elif c['patchIdUniqueToBranch'] == 0:
                  disposition = 'PATCH_EQUIVALENT_TO_W3'
              elif c['name'].startswith('sync/'):
                  disposition = 'EXTERNAL_SYNC_REVIEW'
              elif 'lockfile' in c['name']:
                  disposition = 'LOCKFILE_DELTA_REVIEW'
              else:
                  disposition = 'TIP_WITH_UNIQUE_PATCH_VALUE_REVIEW'
              c['preliminaryDisposition'] = disposition

          # Family memberships: each tip plus all candidate ancestors.
          families = []
          for tip in tips:
              members = sorted({tip} | ancestors_of[tip])
              families.append({
                  'tip': tip,
                  'members': members,
                  'memberCount': len(members),
                  'tipUniquePatchesVsW3': by_name[tip].get('patchIdUniqueToBranch'),
                  'tipChangedPathCountVsW3': len(by_name[tip].get('changedPathsVsW3', [])),
              })
          families.sort(key=lambda f: (-f['memberCount'], f['tip']))

          report = {
              'schema': 'cgev11.w0-orphan-clusters/v1',
              'repository': repo,
              'mainSha': git('rev-parse','origin/main')[0],
              'qualifiedW3SourceSha': qualified,
              'candidateCount': len(candidates),
              'familyTipCount': len(tips),
              'w3PatchIdCount': len(w3_patch_set),
              'families': families,
              'ancestryEdges': ancestry,
              'branches': candidates,
          }
          with open('w0-orphan-clusters.json','w') as f:
              json.dump(report, f, indent=2)
              f.write('\n')

          print(json.dumps({
              'candidateCount': len(candidates),
              'familyTipCount': len(tips),
              'families': families,
              'branches': [
                  {
                      'name': c['name'],
                      'aheadMain': c['aheadOfMain'],
                      'uniqueVsW3': c['uniqueCommitsVsW3'],
                      'patches': c['patchIdCountVsMain'],
                      'overlapW3': c['patchIdOverlapWithW3'],
                      'uniquePatches': c['patchIdUniqueToBranch'],
                      'ratio': c['patchOverlapRatio'],
                      'tip': c['isFamilyTip'],
                      'disposition': c['preliminaryDisposition'],
                  }
                  for c in candidates
              ],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w0-orphan-clusters-${{ github.sha }}
          path: w0-orphan-clusters.json
          if-no-files-found: error
