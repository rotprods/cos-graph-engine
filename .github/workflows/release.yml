name: Release

# Convergence Era: releases are manual-only and publication is disabled by default.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to allow a release qualification attempt'
        required: true
        default: 'NO'

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit release authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo 'Release blocked. Convergence Era disables automatic releases.'
            exit 1
          fi
          echo 'Explicit release qualification authorization received.'

  qualify-only:
    name: Qualification only — no publish
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npm run asbuild
      - run: npm run test:all
      - run: |
          echo 'PASS: release qualification completed.'
          echo 'Publishing/version bump remains intentionally disabled until authority gate.'
