# COS Graph Engine — release only from an explicit version tag.
# This avoids recursive version-bump pushes and keeps releases reproducible.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  test:
    name: Release Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build WASM
        run: npm run asbuild
      - name: Full regression
        run: npm run test:all

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### COS Graph Engine ${GITHUB_REF_NAME}"
            echo
            echo "Release qualified by the full CI regression on Node ${NODE_VERSION}."
            echo
            echo "#### Changes"
          } > release-notes.md
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --oneline "$PREVIOUS_TAG..$GITHUB_REF_NAME" --no-merges >> release-notes.md
          else
            git log --oneline --no-merges -50 >> release-notes.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
