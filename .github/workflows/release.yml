name: Release

# Convergence Era: releases are manual-only and publication is disabled.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to qualify'
        required: true
        default: 'main'
      confirm:
        description: 'Type RELEASE to run qualification (no publish)'
        required: true
        default: 'NO'

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit release qualification authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo 'Release blocked. Convergence Era disables automatic releases.'
            exit 1
          fi

  qualify-only:
    name: Qualification only — no publish
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx --no-install tsc -p tsconfig.build.json --noEmit
      - run: npm run asbuild
      - run: npm run test:all
      - run: |
          echo 'PASS: release qualification completed.'
          echo 'Publishing/version bump remains intentionally disabled until authority gate.'
