# COS Graph Engine — Manual Release
# Releases are manual-only while GitHub governance and cost controls are being hardened.
# This workflow never writes version bumps back to the repository.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (for example 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '18.20.4'
  WORKING_DIR: cos

jobs:
  validate:
    name: Validate requested version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate SemVer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi

  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    outputs:
      tested_sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture exact tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - name: Build WASM
        run: npm run asbuild
      - name: Run full test suite
        run: npm run test:all

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.test.outputs.tested_sha }}
          fetch-depth: 0
      - name: Verify package version matches requested release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$package_version" = "$VERSION" || {
            echo "package.json version $package_version does not match requested $VERSION" >&2
            exit 1
          }
      - name: Generate release notes
        env:
          VERSION: ${{ inputs.version }}
          TESTED_SHA: ${{ needs.test.outputs.tested_sha }}
        run: |
          {
            echo "### COS Graph Engine Release v${VERSION}"
            echo
            echo "Commit: ${TESTED_SHA}"
            echo
            echo "#### Changes"
            git log --oneline "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD --no-merges
          } > release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ needs.test.outputs.tested_sha }}
          body_path: ${{ env.WORKING_DIR }}/release-notes.md
          generate_release_notes: true
          make_latest: true
