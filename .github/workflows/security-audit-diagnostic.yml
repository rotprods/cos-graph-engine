# Diagnostic only. Not included in a whole-repository security certification.
name: Dependency security audit diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Frozen install without lifecycle hooks
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Capture audit; retain non-zero exit as failure
      run: npm audit --json > npm-audit.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: npm-audit-diagnostic
        path: npm-audit.json
        if-no-files-found: error
env:
  NODE_VERSION: 22.12.0
