name: CI

# Convergence Era policy: remote CI is manual-only to avoid unnecessary GitHub Actions spend.
# Local/container verification is the default executor.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Verification scope'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - canonical
          - full

concurrency:
  group: ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manual verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean deterministic install
        run: npm ci
      - name: TypeScript build check
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: Level 1 correctness smoke
        run: npm run test:l1
      - name: WASM build
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run asbuild
      - name: Canonical full suite
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run test:all
      - name: Coverage
        if: ${{ inputs.scope == 'full' }}
        run: npm run coverage

  contract:
    name: CI fail-closed contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject fail-open patterns in CI
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/ci.yml .github/workflows/hardening-shadow-ci.yml; do
            if grep -En '\|\|[[:space:]]*echo|continue-on-error:[[:space:]]*true' "$file"; then
              echo "FAIL: $file contains a fail-open construct"
              exit 1
            fi
          done
          echo 'PASS: CI workflows are fail-closed and manual-only'
