# Manual qualification during COS-MAIN-CONVERGENCE-2026-09-07. No publication or deployment.
name: CI
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: .
env:
  NODE_VERSION: 22.12.0
jobs:
  ci-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: &job_receipts
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
    - &checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - &checkout_identity
      name: Bind checkout to workflow SHA
      id: identity
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"
        test "$actual" = "$GITHUB_SHA"
        printf 'tested_sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: node --test scripts/test-ci-results.mjs
    - &completion_receipt
      name: Seal successful job
      id: seal
      run: printf 'completed=true\n' >> "$GITHUB_OUTPUT"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - &setup_node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: package-lock.json
    - &install
      name: Frozen install without lifecycle hooks
      run: npm ci --ignore-scripts --no-audit --no-fund
    - run: npx --no-install tsc --noEmit
    - *completion_receipt
    needs:
    - ci-contract
    name: Strict Type Check
  test-graph-csr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx scripts/test-csr.ts
    - *completion_receipt
    needs:
    - ci-contract
  test-graph-pruning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx scripts/test-pruning.ts
    - *completion_receipt
    needs:
    - ci-contract
  test-graph-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx scripts/test-benchmark.ts
    - *completion_receipt
    needs:
    - ci-contract
  test-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npm run asbuild
    - run: npx --no-install tsx scripts/test-wasm.ts
    - name: Compiled WASM and JS PageRank oracle
      run: npm test --workspace=@cos/wasm
    - *completion_receipt
    needs:
    - ci-contract
  test-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx packages/observability/tests/tracing.test.ts
    - run: npx --no-install tsx packages/observability/tests/collector.test.ts
    - run: npx --no-install tsx packages/observability/tests/profiler.test.ts
    - run: npx --no-install tsx packages/observability/tests/dashboard.test.ts
    - *completion_receipt
    needs:
    - ci-contract
  test-visualization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx packages/visualization/tests/svg-renderer.test.ts
    - run: npx --no-install tsx packages/visualization/tests/canvas-renderer.test.ts
    - run: npx --no-install tsx packages/visualization/tests/web-component.test.ts
    - *completion_receipt
    needs:
    - ci-contract
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npx --no-install tsx scripts/test-level1-diamond.ts
    - run: npx --no-install tsx scripts/test-level1-mutation.ts
    - run: npx --no-install tsx scripts/test-level3-consistency.ts
    - run: npx --no-install tsx scripts/test-level3-mutation.ts
    - run: npx --no-install tsx scripts/test-level7-compute.ts
    - run: npx --no-install tsx scripts/test-levels-12-19.ts
    - run: npx --no-install tsx scripts/test-level0-visual.ts
    - run: npx --no-install tsx scripts/test-level2-state.ts
    - run: npx --no-install tsx scripts/test-level4-call.ts
    - run: npx --no-install tsx scripts/test-level5-cfg.ts
    - run: npx --no-install tsx scripts/test-level6-dataflow.ts
    - run: npx --no-install tsx scripts/test-levels-8-11.ts
    - *completion_receipt
    needs:
    - ci-contract
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npm run asbuild
    - run: npx --no-install tsx scripts/benchmark-perf.ts 2>&1
    - run: npx --no-install tsx scripts/generate-benchmark-report.ts 2>&1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: benchmark-report
        path: benchmark-report.html
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: benchmark-history
        path: benchmark-reports/
        if-no-files-found: error
    - *completion_receipt
    needs:
    - ci-contract
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - run: npm run coverage 2>&1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: error
    - *completion_receipt
    needs:
    - ci-contract
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: docker build --tag "cos-graph-engine:ci-${GITHUB_SHA}" .
    - *completion_receipt
    needs:
    - ci-contract
    - lint
    - test-graph-csr
    - test-graph-pruning
    - test-graph-benchmark
    - test-wasm
    - test-observability
    - test-visualization
    - test-core
    - benchmark
    - coverage
    name: Docker Build Only (no registry login or push)
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs: *job_receipts
    steps:
    - *checkout
    - *checkout_identity
    - *setup_node
    - *install
    - name: Build WASM for clean full regression
      run: npm run asbuild
    - run: npm run test:all 2>&1
    - *completion_receipt
    needs:
    - ci-contract
    - lint
    - test-graph-csr
    - test-graph-pruning
    - test-graph-benchmark
    - test-wasm
    - test-observability
    - test-visualization
    - test-core
    - benchmark
    - coverage
    - docker
  complete:
    name: All configured CI checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
    - ci-contract
    - lint
    - test-graph-csr
    - test-graph-pruning
    - test-graph-benchmark
    - test-wasm
    - test-observability
    - test-visualization
    - test-core
    - benchmark
    - coverage
    - docker
    - full-regression
    steps:
    - *checkout
    - *checkout_identity
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Fail closed on every mandatory job and receipt
      env:
        COS_CI_RESULTS: ${{ toJSON(needs) }}
      run: node scripts/verify-ci-results.mjs
