name: CI — AI Agency OS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  code-review:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: AI Code Review
        uses: rotprods/ai-code-review@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: OpenAI API key para review más profundo
          # openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Higgsfield
        run: |
          echo "Deploying via Higgsfield API..."
          # curl -X POST "https://api.higgsfield.app/deploy" \
          #   -H "Authorization: Bearer ${{ secrets.HIGGSFIELD_TOKEN }}" \
          #   -d "{\"website_id\": \"${{ secrets.WEBSITE_ID }}\"}"