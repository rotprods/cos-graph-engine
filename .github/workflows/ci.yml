name: CI

# Convergence Era policy: remote CI is manual-only to avoid unnecessary GitHub Actions spend.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to verify'
        required: true
        default: 'main'
      scope:
        description: 'Verification scope'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - canonical
          - full

permissions:
  contents: read

concurrency:
  group: ci-manual-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Manual verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean deterministic install
        run: npm ci
      - name: TypeScript build check
        run: npx --no-install tsc -p tsconfig.build.json --noEmit
      - name: Level 1 correctness smoke
        run: npm run test:l1
      - name: WASM build
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run asbuild
      - name: Canonical full suite
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run test:all
      - name: Coverage
        if: ${{ inputs.scope == 'full' }}
        run: npm run coverage
