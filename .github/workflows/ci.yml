name: COS Main Convergence Gate

on:
  push:
    branches: [integration/main-baseline-20260907, main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cos-main-convergence-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test scripts/test-ci-results.mjs
      - run: node scripts/test-workflow-safety.mjs
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  quality-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx scripts/test-config-bindings.cjs
      - run: node --import tsx scripts/test-auth-boundary.cjs
      - run: node scripts/test-memory-regressions.cjs
      - run: npm run asbuild
      - run: npm test --workspace=@cos/wasm
      - run: npx --no-install tsc --noEmit
      - run: timeout 300s npm run test:all
      - run: npm audit --audit-level=high
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  specialized:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run asbuild
      - run: npm run test:csr
      - run: npm run test:pruning
      - run: npm run test:benchmark
      - run: npm run test:wasm
      - run: npx --no-install tsx scripts/test-wasm-extended.ts
      - run: npm run test:observability
      - run: npm run test:visualization
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run asbuild
      - run: npm run benchmark
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run asbuild
      - run: npm run coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      completed: ${{ steps.seal.outputs.completed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
      - run: docker build --tag "cos-graph-engine:convergence-${GITHUB_SHA}" .
      - name: Runtime workspace module resolution smoke
        run: |
          image="cos-graph-engine:convergence-${GITHUB_SHA}"
          docker run --rm --entrypoint node "$image" -e "require('@cos/core'); require('@cos/api'); require('@cos/infrastructure'); console.log('runtime-module-resolution-ok')"
      - id: seal
        run: echo 'completed=true' >> "$GITHUB_OUTPUT"

  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [contract, quality-core, specialized, performance, coverage, docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - env:
          COS_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-results.mjs
