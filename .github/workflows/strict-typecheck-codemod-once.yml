name: Strict typecheck exact codemod (one-shot)

on:
  push:
    branches: [fix/strict-typecheck-regressions]
    paths:
      - .github/workflows/strict-typecheck-codemod-once.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-typecheck-regressions
      - name: Apply exact guarded replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'packages/cognition/src/advanced-reasoning.ts',
              'bestConfidence: bestLeaf?.confidence },',
              'bestConfidence: bestLeaf?.confidence ?? null },',
          )

          replace_exact(
              'packages/observability/src/dashboard.ts',
              "      const { fetch } = await import('node:http');\n",
              '',
          )

          replace_exact(
              'packages/api/src/http-server.ts',
              "conclusions: reasoningSteps.slice(-2).map(s => s.output.substring(0, 100)),",
              "conclusions: reasoningSteps.slice(-2).map(s => String(s.output ?? '').substring(0, 100)),",
          )

          p = Path('packages/api/src/http-server.ts')
          text = p.read_text()
          marker = 'function getResearchHTML(): string { return `<!DOCTYPE html>'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('http-server.ts: getResearchHTML marker not found')
          prefix, segment = text[:start], text[start:]
          before = len(re.findall(r'(?<!\\)\$\{', segment))
          if before < 5:
              raise SystemExit(f'http-server.ts: expected multiple unescaped client interpolations, found {before}')
          segment = re.sub(r'(?<!\\)\$\{', r'\\${', segment)
          p.write_text(prefix + segment)
          print(f'Escaped {before} client-side interpolation markers in getResearchHTML')
          PY
      - name: Self-delete and commit
        run: |
          git config user.name "COS Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/strict-typecheck-codemod-once.yml
          git add packages/api/src/http-server.ts packages/cognition/src/advanced-reasoning.ts packages/observability/src/dashboard.ts
          git diff --cached --check
          git commit -m "fix(types): repair API template, reasoning metadata and OTLP exporter"
          git push origin HEAD:fix/strict-typecheck-regressions
