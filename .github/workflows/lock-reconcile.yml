name: Lock Reconcile

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**/package.json'
      - '.github/workflows/lock-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: lock-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ci-root-workspace-node22-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Snapshot manifests
        run: find . -name package.json -not -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/manifests.before
      - name: Regenerate lockfile from workspace manifests
        run: npm install --package-lock-only --ignore-scripts
      - name: Refuse manifest mutation
        run: |
          find . -name package.json -not -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/manifests.after
          diff -u /tmp/manifests.before /tmp/manifests.after
      - name: Prove exact install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit reconciled lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(lock): reconcile monorepo workspace metadata'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
