name: Refresh toolchain lock (one-shot)

on:
  push:
    branches: [fix/ci-working-directory-root]
    paths:
      - package.json
      - .github/workflows/refresh-toolchain-lock.yml

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-working-directory-root
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Regenerate lock from pinned manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify frozen install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Self-delete workflow and commit lock
        run: |
          git config user.name "COS CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refresh-toolchain-lock.yml
          git add package-lock.json
          git commit -m "fix(toolchain): refresh frozen package lock"
          git push origin HEAD:fix/ci-working-directory-root
