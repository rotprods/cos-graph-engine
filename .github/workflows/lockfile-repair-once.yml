name: TypeScript 5.9 Diagnostic Once

on:
  push:
    branches:
      - repair/cos-lockfile-v21-20260901

permissions:
  contents: read

concurrency:
  group: cos-typescript-59-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/actions-cost-failclosed-20260831
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Install locked dependencies
        run: npm ci
      - name: Compare against TypeScript 5.9 without mutating target
        shell: bash
        run: |
          set -uo pipefail
          status=0
          npx --yes --package typescript@5.9.3 tsc -p tsconfig.build.json --noEmit > /tmp/tsc59.log 2>&1 || status=$?
          cat /tmp/tsc59.log
          printf 'TSC59_EXIT=%s\n' "$status"
          printf 'TSC59_ERROR_COUNT=%s\n' "$(grep -c 'error TS' /tmp/tsc59.log || true)"
          exit 0
