name: Repository Hygiene Repair Once

on:
  push:
    branches:
      - repair/cos-lockfile-v21-20260901

permissions:
  contents: write

concurrency:
  group: cos-repository-hygiene-v21
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/actions-cost-failclosed-20260831
          fetch-depth: 0
      - name: Remove stale unconfigured gitlink
        shell: bash
        run: |
          set -euo pipefail
          path='cos-graph-engine-026bb43d-eec2-4a08-872e-020acdbf97cf'
          git ls-files --stage "$path"
          git rm -f "$path"
          test ! -e "$path"
          if git ls-files --stage "$path" | grep -q .; then
            echo 'stale gitlink still tracked' >&2
            exit 1
          fi
      - name: Commit repository hygiene fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(repo): remove stale unconfigured gitlink'
          git push origin HEAD:security/actions-cost-failclosed-20260831
