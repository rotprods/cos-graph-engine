name: Coverage Measurement Campaign V1

on:
  push:
    branches: [test/coverage-measurement-v1]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-measurement-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsc --noEmit
      - run: npm run coverage
      - run: node scripts/check-coverage-baseline.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-measurement-v1-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
