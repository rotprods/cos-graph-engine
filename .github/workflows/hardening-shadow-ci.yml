name: Hardening Shadow CI

# Cost-control policy: manual-only remote verification.
# Local/container verification is the default during the Convergence Era.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Verification scope'
        required: true
        default: 'canonical'
        type: choice
        options:
          - smoke
          - canonical
          - full

concurrency:
  group: hardening-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-truth:
    name: Canonical truth — install, typecheck, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean deterministic install
        run: npm ci
      - name: TypeScript build check
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: Level 1 correctness smoke
        run: npm run test:l1
      - name: WASM build — fail closed
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run asbuild
      - name: Full canonical test suite
        if: ${{ inputs.scope != 'smoke' }}
        run: npm run test:all
      - name: Coverage / extended verification
        if: ${{ inputs.scope == 'full' }}
        run: npm run coverage

  ci-contract:
    name: CI truth contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known fail-open patterns in hardening workflow
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/hardening-shadow-ci.yml'
          if grep -En '\|\|[[:space:]]*echo|continue-on-error:[[:space:]]*true' "$file"; then
            echo 'FAIL: hardening CI contains a fail-open construct'
            exit 1
          fi
          echo 'PASS: hardening CI is fail-closed and manual-only'

  complete:
    name: Hardening shadow gate
    runs-on: ubuntu-latest
    needs: [canonical-truth, ci-contract]
    if: success()
    steps:
      - run: echo 'PASS — manual hardening verification is green with no suppressed required failures'
