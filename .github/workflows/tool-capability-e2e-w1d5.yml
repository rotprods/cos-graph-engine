name: Tool Capability E2E W1D5

on:
  push:
    branches: [fix/tool-capability-e2e-w1d5]
  pull_request:
    branches: [fix/tool-capability-isolation-w1d]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tool-capability-e2e-w1d5-${{ github.ref }}
  cancel-in-progress: true

env:
  W1D5_PARENT_SHA: 'aadd8a1079f5acd2d3f0f9b00af3bd6c8bc83e0b'
  W1C_SANDBOX_IMAGE: 'node@sha256:ef24c5053d50fdc3e4e56eb4e7ddb7861874ab0fdc797046ba897581deb8e868'

jobs:
  node22-authority-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${W1D5_PARENT_SHA}^{commit}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind Node 22 minimum runtime
        run: |
          set -euo pipefail
          node --version | tee w1d5-node22-version.log
          test "$(node --version)" = 'v22.12.0'
      - name: Verify and pre-pull W1C sandbox TCB
        run: |
          set -euo pipefail
          docker version 2>&1 | tee w1d5-node22-docker.log
          docker pull "$W1C_SANDBOX_IMAGE" 2>&1 | tee w1d5-node22-image-pull.log
          docker image inspect "$W1C_SANDBOX_IMAGE" --format '{{json .RepoDigests}}' | tee w1d5-node22-image-inspect.log
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: W1D registry contract
        run: node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee w1d5-node22-registry.log
      - name: W1D5 cross-tool composition contract
        run: node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs 2>&1 | tee w1d5-node22-e2e.log
      - name: W1C sandbox contract on Node 22
        run: |
          set -euo pipefail
          node scripts/test-sandbox-security-w1c.cjs 2>&1 | tee w1d5-node22-sandbox.log
          node scripts/test-sandbox-security-w1c-hardening.cjs 2>&1 | tee w1d5-node22-sandbox-hardening.log
      - name: Full canonical suite
        run: npm run test:all 2>&1 | tee w1d5-node22-test-all.log
      - name: Integrated coverage + W1C ratchet
        run: |
          set -euo pipefail
          npm run asbuild
          npx --no-install c8 --reporter=text --reporter=lcov --reporter=json-summary sh -c 'npm run test:coverage:all && node scripts/test-sandbox-security-w1c.cjs && node scripts/test-sandbox-security-w1c-hardening.cjs && node --import tsx scripts/test-tool-capability-w1d.cjs && node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs' 2>&1 | tee w1d5-node22-coverage.log
          node scripts/check-w1c-coverage-ratchet.mjs
      - name: High-severity dependency audit
        run: npm audit --audit-level=high 2>&1 | tee w1d5-node22-audit.log
      - name: Scope and anti-bypass policy
        run: |
          set -euo pipefail
          git diff --unified=0 "$W1D5_PARENT_SHA"...HEAD -- '*.ts' '*.cjs' > w1d5-source.diff
          if grep -E '^\+.*(as any|@ts-ignore|@ts-nocheck|continue-on-error|new Function\(|eval\(|console\.log[[:space:]]*=)' w1d5-source.diff; then
            echo 'W1D5 introduced a forbidden bypass or dynamic-code primitive' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              packages/execution/src/tool-runtime.ts|scripts/test-tool-capability-e2e-w1d5.cjs|scripts/test-filesystem-confinement-w1d2.cjs|scripts/test-http-egress-w1d3.cjs|scripts/test-search-tool-w1d4.cjs|.github/workflows/tool-capability-e2e-w1d5.yml|docs/hardening/tool-capability-e2e/W1D5_RED_EVIDENCE.md|docs/hardening/tool-capability-e2e/W1D5_GREEN_EVIDENCE.md|docs/hardening/tool-capability-e2e/W1D5_COMPOSITION.md)
                ;;
              *)
                echo "Unexpected W1D5 scope mutation: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$W1D5_PARENT_SHA"...HEAD)
      - name: Preserve Node 22 authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-capability-e2e-w1d5-node22-${{ github.sha }}
          path: |
            w1d5-node22-*.log
            w1d5-source.diff
            w1c-coverage-ratchet.json
            coverage/
          if-no-files-found: warn

  node26-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind Node 26 comparison runtime
        run: |
          set -euo pipefail
          node --version | tee w1d5-node26-version.log
          test "$(node --version)" = 'v26.8.2'
      - name: Verify sandbox TCB
        run: |
          set -euo pipefail
          docker pull "$W1C_SANDBOX_IMAGE" 2>&1 | tee w1d5-node26-image-pull.log
      - name: Strict TypeScript
        run: npx --no-install tsc --noEmit
      - name: Authority contracts on Node 26
        run: |
          set -euo pipefail
          node --import tsx scripts/test-tool-capability-w1d.cjs 2>&1 | tee w1d5-node26-registry.log
          node --import tsx scripts/test-tool-capability-e2e-w1d5.cjs 2>&1 | tee w1d5-node26-e2e.log
          node scripts/test-sandbox-security-w1c.cjs 2>&1 | tee w1d5-node26-sandbox.log
          node scripts/test-sandbox-security-w1c-hardening.cjs 2>&1 | tee w1d5-node26-sandbox-hardening.log
      - name: Full canonical suite on Node 26
        run: npm run test:all 2>&1 | tee w1d5-node26-test-all.log
      - name: Preserve Node 26 compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-capability-e2e-w1d5-node26-${{ github.sha }}
          path: w1d5-node26-*.log
          if-no-files-found: warn
