name: CGEV11 test-all shard diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  NODE_VERSION: '22.12.0'
jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsx scripts/run-tests.ts
      - run: npx --no-install tsx scripts/test-level1-diamond.ts
      - run: npx --no-install tsx scripts/test-level1-mutation.ts
      - run: npx --no-install tsx scripts/test-level3-consistency.ts
      - run: npx --no-install tsx scripts/test-level3-mutation.ts
      - run: npx --no-install tsx scripts/test-level7-compute.ts
      - run: npx --no-install tsx scripts/test-levels-12-19.ts
      - run: npx --no-install tsx scripts/test-pipeline-l45l6.ts
      - run: npx --no-install tsx scripts/test-pipeline-l891011.ts
      - run: npx --no-install tsx scripts/test-pipeline-l12131415.ts
      - run: npx --no-install tsx scripts/test-pipeline-l16171819.ts
      - run: npx --no-install tsx scripts/test-cli-visualizer.ts
