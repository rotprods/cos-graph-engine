name: CGE V11 test-all shard diagnostic

on:
  push:
    branches: [fix/strict-typecheck-regressions]
    paths:
      - '.github/workflows/cgev11-testall-shard-diagnostic.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.12.0'

jobs:
  base-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/run-tests.ts

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: |
          npx tsx scripts/test-level1-diamond.ts
          npx tsx scripts/test-level1-mutation.ts
          npx tsx scripts/test-level3-consistency.ts
          npx tsx scripts/test-level3-mutation.ts
          npx tsx scripts/test-level7-compute.ts

  levels-and-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: |
          npx tsx scripts/test-levels-12-19.ts
          npx tsx scripts/test-pipeline-l45l6.ts
          npx tsx scripts/test-pipeline-l891011.ts
          npx tsx scripts/test-pipeline-l12131415.ts
          npx tsx scripts/test-pipeline-l16171819.ts

  cli-visualizer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/test-cli-visualizer.ts
