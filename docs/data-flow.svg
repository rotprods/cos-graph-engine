<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" style="background:#0d1117;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f85149"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/></marker>
  </defs>

  <text x="450" y="30" fill="#c9d1d9" font-size="18" font-weight="600" text-anchor="middle">COS Data Flow — Request Lifecycle</text>

  <!-- Layer boxes -->
  <rect x="50" y="45" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="65" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">APPLICATION LAYER</text>

  <rect x="50" y="90" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="110" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">ORCHESTRATION LAYER</text>

  <rect x="50" y="135" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="155" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">COGNITION LAYER</text>

  <rect x="50" y="180" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="200" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">KNOWLEDGE LAYER</text>

  <rect x="50" y="225" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="245" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">MEMORY LAYER</text>

  <rect x="50" y="270" width="150" height="30" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="290" fill="#8b949e" font-size="10" text-anchor="middle" fill-opacity="0.8">EXECUTION LAYER</text>

  <!-- Nodes -->
  <rect x="280" y="50" width="180" height="36" rx="6" fill="#238636" opacity="0.9"/>
  <text x="370" y="73" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">HTTP Request</text>

  <rect x="280" y="110" width="180" height="36" rx="6" fill="#1f6feb" opacity="0.9"/>
  <text x="370" y="133" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Auth Middleware</text>

  <rect x="280" y="170" width="180" height="36" rx="6" fill="#8957e5" opacity="0.9"/>
  <text x="370" y="193" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Router</text>

  <rect x="140" y="250" width="160" height="36" rx="6" fill="#d29922" opacity="0.9"/>
  <text x="220" y="273" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Cell.process()</text>

  <rect x="340" y="250" width="160" height="36" rx="6" fill="#d29922" opacity="0.9"/>
  <text x="420" y="273" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Reasoning Engine</text>

  <rect x="540" y="250" width="160" height="36" rx="6" fill="#d29922" opacity="0.9"/>
  <text x="620" y="273" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">LLM.generate()</text>

  <rect x="60" y="340" width="140" height="36" rx="6" fill="#3fb950" opacity="0.9"/>
  <text x="130" y="363" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Memory.store()</text>

  <rect x="240" y="340" width="140" height="36" rx="6" fill="#3fb950" opacity="0.9"/>
  <text x="310" y="363" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Knowledge.query()</text>

  <rect x="420" y="340" width="140" height="36" rx="6" fill="#3fb950" opacity="0.9"/>
  <text x="490" y="363" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">SelfImprove.record()</text>

  <rect x="600" y="340" width="140" height="36" rx="6" fill="#3fb950" opacity="0.9"/>
  <text x="670" y="363" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Response</text>

  <!-- Arrows -->
  <line x1="370" y1="86" x2="370" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="146" x2="370" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="370" y1="206" x2="220" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="206" x2="420" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="206" x2="620" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="220" y1="286" x2="130" y2="340" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="286" x2="310" y2="340" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="286" x2="490" y2="340" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="286" x2="670" y2="340" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="370,220 390,240 370,260 350,240" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <text x="370" y="244" fill="#d29922" font-size="9" text-anchor="middle">route</text>

  <!-- Labels -->
  <text x="200" y="240" fill="#8b949e" font-size="9" text-anchor="middle">[target]</text>
  <text x="420" y="240" fill="#8b949e" font-size="9" text-anchor="middle">[reasoning]</text>
  <text x="620" y="240" fill="#8b949e" font-size="9" text-anchor="middle">[default]</text>

  <!-- Bottom annotation -->
  <text x="450" y="420" fill="#8b949e" font-size="11" text-anchor="middle">Each request flows through: Auth  Route  Process  Store  Respond</text>
  <text x="450" y="436" fill="#484f58" font-size="10" text-anchor="middle">All branches execute Memory.store() + SelfImprove.record() automatically</text>

  <!-- Stats -->
  <rect x="250" y="460" width="400" height="100" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="450" y="480" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">Path Statistics</text>
  <text x="270" y="500" fill="#8b949e" font-size="11">[target] cell.process()  direct execution via CogCell</text>
  <text x="270" y="518" fill="#8b949e" font-size="11">[reasoning] engine.reason()  5 engines available</text>
  <text x="270" y="536" fill="#8b949e" font-size="11">[default] llm.generate()  auto-selects best provider</text>
</svg>