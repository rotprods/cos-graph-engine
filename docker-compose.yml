# COS Graph Engine — Docker Compose
# Local development & production deployment

version: "3.9"

services:
  # ============================================================
  # COS Graph Engine
  # ============================================================
  cos-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cos-engine
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # Telemetry dashboard
    environment:
      NODE_ENV: production
      PORT: 8080
      COS_GRAPH_ENGINE_VERSION: 2.1.0
      COS_TELEMETRY_PORT: 9090
      COS_LOG_LEVEL: info
      COS_CACHE_SIZE: 1000
      COS_MAX_GRAPH_SIZE: 100000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - cos-data:/data/cos
    networks:
      - cos-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Prometheus (metrics collection)
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: cos-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    depends_on:
      cos-engine:
        condition: service_healthy
    networks:
      - cos-net

  # ============================================================
  # Grafana (visualization)
  # ============================================================
  grafana:
    image: grafana/grafana:11.5.0
    container_name: cos-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cos-admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - cos-net

volumes:
  cos-data:
  prometheus-data:
  grafana-data:

networks:
  cos-net:
    driver: bridge